name: "Setup"
description: "Setup dependencies required to run pipelines"

inputs:
  GITHUB_TOKEN:
    description: "GitHub token used to send message"
    required: false
    default: ${{ github.token }}
  AZURE_CLIENT_ID:
    description: "Azure client ID if azure authentication is required."
    required: false
  AZURE_CLIENT_SECRET:
    description: "Azure client secret if azure authentication is required."
    required: false
  AZURE_TENANT_ID:
    description: "Azure tenant ID if azure authentication is required."
    required: false
  AZURE_SUBSCRIPTION_ID:
    description: "Azure subscription ID if azure authentication is required."
    required: false
  INSTALL_JUST:
    description: "Would you like to install Just? Defaults to false"
    required: false
    default: "false"
  HEADSCALE_ADDRESS:
    description: "Headscale address (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  HEADSCALE_USER:
    description: "Headscale user (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  HEADSCALE_PREAUTHKEY:
    description: "Headscale preauthkey (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  SECRETS:
    description: "Pass toJSON(secrets) from the calling workflow to expose all secrets as env vars."
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup
      uses: tahminator/pipeline/actions/setup@1.0.73
      with:
        AZURE_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ inputs.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        INSTALL_SOPS: true
        INSTALL_JUST: ${{ inputs.INSTALL_JUST }}
        HEADSCALE_ADDRESS: ${{ inputs.HEADSCALE_ADDRESS }}
        HEADSCALE_USER: ${{ inputs.HEADSCALE_USER }}
        HEADSCALE_PREAUTHKEY: ${{ inputs.HEADSCALE_PREAUTHKEY }}
        SECRETS: ${{ inputs.SECRETS }}

    - name: Test CI scripts
      shell: bash
      run: bun run --cwd .github/scripts test
