# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Slash Command Dispatch
run-name: Slash Command Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  slashCommandDispatch:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # stay on trusted default-branch code until the commands action authorizes the commenter
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup pipeline
        uses: tahminator/pipeline/actions/setup@5a902e0276127b6a9ec2d37c2d4ee25eb2e71f6f # 1.0.87
        with:
          LINT_CI: true

      - name: Slash Command Dispatch
        uses: tahminator/pipeline/actions/commands@8f9210dfe6c4e75d5e650b1fbf802e4ebdb38e4d # 1.0.89-beta.g8f9210df
        with:
          APP_ID: ${{ secrets._GITHUB_APP_APP_ID }}
          PRIVATE_KEY: ${{ secrets._GITHUB_APP_PEM_CONTENT }}
          DYNAMIC_COMMANDS_BUN_SCRIPT: .github/scripts/src/load-slash-commands/index.ts
