checks:
  exclude:
    - no-read-only-root-fs
    - run-as-non-root
    - no-anti-affinity
    # CNPG's postgres Service selects pods created by the operator at
    # runtime (not present in the static manifest), so this is a
    # permanent false positive for that resource.
    - dangling-service
    # Tailscale's kernel-mode networking (TS_USERSPACE=false) requires
    # NET_RAW/NET_ADMIN per Tailscale's own Kubernetes requirements; this
    # is an intentional, permanent exception for the vpn sidecars.
    - drop-net-raw-capability
    # TS_KUBE_SECRET's value is the *name* of a Secret object the
    # Tailscale sidecar manages state in, not credential material -- a
    # permanent false positive of this check's name-based heuristic.
    - env-var-secret
    # postgres-backup's pg_dump footprint depends on database size; sizing
    # requires an infra owner decision, not a CI-check default. Tracked as
    # follow-up work; re-enable once sized.
    - unset-cpu-requirements
    - unset-memory-requirements
    # Checked per Flux target (see scripts/validate-manifests.sh), so a
    # ServiceAccount defined by one target (e.g. base/infrastructure/azure/
    # serviceaccount) and referenced by another (e.g.
    # base/infrastructure/postgres/backup) false-positives here; kube-linter
    # doesn't reliably support the alternative (a single merged object set
    # across all targets -- large explicit multi-file arg lists made it hang).
    - non-existent-service-account
