apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebloom-leetcode-auth-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: codebloom-leetcode-auth-service
  template:
    metadata:
      labels:
        app: codebloom-leetcode-auth-service
        version: "N/A" # replaced by the overlay kustomization.yaml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: codebloom-leetcode-auth-service
          image: patinanetwork/codebloom-leetcode-auth-service-arm
          ports:
            - name: grpc
              containerPort: 50052
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: VERSION
              value: "N/A" # replaced by the overlay kustomization.yaml
            - name: GRPC_LASS_HOST
              value: codebloom-leetcode-auth-stealer-service:50051
            - name: GRPC_LASS_TLS
              value: "false"
            - name: GRPC_LASS_TIMEOUT_SECONDS
              value: "180"
          envFrom:
            - secretRef:
                name: codebloom-leetcode-auth-service-secrets
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "250m"
