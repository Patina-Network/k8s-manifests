apiVersion: v1
kind: Service
metadata:
  name: codebloom-leetcode-auth-service
spec:
  type: ClusterIP
  selector:
    app: codebloom-leetcode-auth-service
  ports:
    - name: grpc
      protocol: TCP
      port: 50052
      targetPort: grpc
    - name: http
      protocol: TCP
      port: 8082
      targetPort: http
