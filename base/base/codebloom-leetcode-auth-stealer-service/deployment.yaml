apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebloom-leetcode-auth-stealer-service
spec:
  replicas: 1
  strategy:
    # One WireGuard identity cannot be shared by overlapping pods.
    type: Recreate
  selector:
    matchLabels:
      app: codebloom-leetcode-auth-stealer-service
  template:
    metadata:
      labels:
        app: codebloom-leetcode-auth-stealer-service
        version: "N/A"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # gluetun/vpn can be enabled by uncommenting this section out if necessary
      # dnsPolicy: None
      # dnsConfig:
      #   nameservers:
      #     - 127.0.0.1
      # volumes:
      #   - name: dev-net-tun
      #     hostPath:
      #       path: /dev/net/tun
      #       type: CharDevice
      # initContainers:
      #   - name: gluetun
      #     image: qmcgaw/gluetun:v3.41.3
      #     restartPolicy: Always
      #     securityContext:
      #       runAsNonRoot: false
      #       runAsUser: 0
      #       capabilities:
      #         add:
      #           - NET_ADMIN
      #     env:
      #       - name: VPN_SERVICE_PROVIDER
      #         value: mullvad
      #       - name: VPN_TYPE
      #         value: wireguard
      #       - name: WIREGUARD_PRIVATE_KEY
      #         valueFrom:
      #           secretKeyRef:
      #             name: codebloom-leetcode-auth-stealer-service-vpn
      #             key: WIREGUARD_PRIVATE_KEY
      #       - name: WIREGUARD_ADDRESSES
      #         valueFrom:
      #           secretKeyRef:
      #             name: codebloom-leetcode-auth-stealer-service-vpn
      #             key: WIREGUARD_ADDRESSES
      #       - name: FIREWALL
      #         value: "on"
      #       # Preserve inbound gRPC, probes, HTTP, and Prometheus scraping.
      #       - name: FIREWALL_INPUT_PORTS
      #         value: "50051,8081"
      #       # AKS pod/node CIDRs: keep cross-node replies and probes local.
      #       # These destinations bypass the VPN; never use all of 10.0.0.0/8.
      #       - name: FIREWALL_OUTBOUND_SUBNETS
      #         value: "10.244.0.0/16,10.224.0.0/16"
      #       - name: SERVER_COUNTRIES
      #         value: Canada
      #     volumeMounts:
      #       - name: dev-net-tun
      #         mountPath: /dev/net/tun
      #     startupProbe:
      #       exec:
      #         command: ["/gluetun-entrypoint", "healthcheck"]
      #       periodSeconds: 5
      #       timeoutSeconds: 5
      #       failureThreshold: 60
      #     readinessProbe:
      #       exec:
      #         command: ["/gluetun-entrypoint", "healthcheck"]
      #       periodSeconds: 5
      #       timeoutSeconds: 5
      #       failureThreshold: 1
      #     # Gluetun repairs unhealthy tunnels internally; no liveness restart.
      #     resources:
      #       requests:
      #         memory: "64Mi"
      #         cpu: "10m"
      #       limits:
      #         memory: "256Mi"
      #         cpu: "500m"
      containers:
        - name: codebloom-leetcode-auth-stealer-service
          image: patinanetwork/codebloom-leetcode-auth-stealer-service-arm
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: VERSION
              value: "N/A"
            - name: AUTH_TIMEOUT_SECONDS
              value: "60"
          resources:
            requests:
              memory: "100Mi"
              cpu: "1m"
            limits:
              memory: "1.75Gi"
              cpu: "1000m"
