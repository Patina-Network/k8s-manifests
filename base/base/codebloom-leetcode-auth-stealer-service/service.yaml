apiVersion: v1
kind: Service
metadata:
  name: codebloom-leetcode-auth-stealer-service
spec:
  type: ClusterIP
  selector:
    app: codebloom-leetcode-auth-stealer-service
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: grpc
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
