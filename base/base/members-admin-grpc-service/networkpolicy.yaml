apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: members-admin-grpc-service
spec:
  podSelector:
    matchLabels:
      app: members-admin-grpc-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: members-grpc-service
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 3000
