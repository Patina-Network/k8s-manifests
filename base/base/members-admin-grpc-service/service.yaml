apiVersion: v1
kind: Service
metadata:
  name: members-admin-grpc-service
spec:
  clusterIP: None
  selector:
    app: members-admin-grpc-service
  ports:
    - name: http-web
      protocol: TCP
      port: 80
      targetPort: http-web
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: grpc
