apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: tech@patinanetwork.org
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
      # used for proxy.patinanetwork.org (tailnet-only, not reachable over
      # http01 since it's never exposed to the internet) - see
      # ../../headscale/proxy-traefik
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: issuer-secrets
              key: digitaloceanDnsPat
        selector:
          dnsZones:
            - "proxy.patinanetwork.org"
