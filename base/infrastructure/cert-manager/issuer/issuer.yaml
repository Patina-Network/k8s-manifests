apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: tech@patinanetwork.org
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      # used for public
      - http01:
          ingress:
            class: traefik
      # used for vpn
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: issuer-secrets
              key: digitaloceanDnsPat
        selector:
          dnsZones:
            - "vpn.patinanetwork.org"
