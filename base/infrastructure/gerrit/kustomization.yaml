apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.yaml
  - service.yaml
  - statefulset.yaml
configMapGenerator:
  - name: gerrit-config
    files:
      - gerrit.config
commonLabels:
  app: gerrit
images:
  - name: patinanetwork/gerrit
    newTag: 1.0.5 # update me to change version

replacements:
  - source:
      kind: StatefulSet
      name: gerrit
      fieldPath: spec.template.spec.containers.[name=gerrit].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: StatefulSet
          name: gerrit
        fieldPaths:
          - spec.template.metadata.labels.version
