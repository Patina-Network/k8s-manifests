apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-proxy
  namespace: infrastructure
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coredns-proxy
  template:
    metadata:
      labels:
        app: coredns-proxy
    spec:
      volumes:
        - name: config
          configMap:
            name: coredns-proxy-config
      containers:
        - name: coredns
          image: coredns/coredns # replaced from kustomization.yaml
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - { containerPort: 53, name: dns, protocol: UDP }
            - { containerPort: 53, name: dns-tcp, protocol: TCP }
            - { containerPort: 8080, name: health, protocol: TCP }
            - { containerPort: 8181, name: ready, protocol: TCP }
          volumeMounts:
            - { name: config, mountPath: /etc/coredns, readOnly: true }
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
