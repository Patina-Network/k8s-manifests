apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: infrastructure
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
        version: "N/A" # replaced from kustomization.yaml
    spec:
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
      containers:
        - name: headscale
          image: headscale/headscale # replaced from kustomization.yaml
          args:
            - serve
          env:
            - name: HEADSCALE_DATABASE_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: headscale-secrets
                  key: databasePassword
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - { name: config, mountPath: /etc/headscale, readOnly: true }
            - { name: data, mountPath: /var/lib/headscale }
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
