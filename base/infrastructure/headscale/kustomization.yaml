apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - pvc.yaml
  - secrets.yaml
  - service.yaml
configMapGenerator:
  - name: headscale-config
    files:
      - config.yaml
commonLabels:
  app: headscale
images:
  - name: headscale/headscale
    newTag: v0.29.3 # update me to change version

replacements:
  - source:
      kind: Deployment
      name: headscale
      fieldPath: spec.template.spec.containers.[name=headscale].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: headscale
        fieldPaths:
          - spec.template.metadata.labels.version
