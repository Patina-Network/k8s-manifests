apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxy-traefik
  namespace: infrastructure
spec:
  # A second, tailnet-only Traefik instance - separate from the public-facing
  # one in ../../traefik. It uses its own ingressClass ("traefik-internal")
  # and its own entryPoint name ("web-internal") so that the public Traefik
  # instance (which watches IngressRoutes cluster-wide too) never has a
  # matching entryPoint to route them on - the routes attached here are
  # structurally inert on the public instance.
  #
  # It joins the tailnet directly via a `tailscale` sidecar (see
  # additionalContainers below) rather than being reached through a subnet
  # router, so only this pod's own tailnet IP is exposed - nothing else in
  # the cluster's Service CIDR. See ../proxy-coredns's Corefile: it resolves
  # *.proxy.patinanetwork.org with a CNAME straight to this pod's own
  # MagicDNS name, so nothing here needs to publish/track its own IP either.
  #
  # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
  interval: 30m
  install:
    createNamespace: true
    # CRDs (IngressRoute, Middleware, etc.) are already installed by the
    # public `traefik` HelmRelease - no need to install them a second time.
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "39.0.7"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  values:
    serviceAccount:
      # Our own SA (see serviceaccount.yaml) instead of the chart's
      # auto-created one, so the tailscale sidecar's Role (get/update/patch
      # on proxy-traefik-tailscale-state) can be bound to it. The chart's own
      # rbac.enabled ClusterRole/ClusterRoleBinding still gets bound to this
      # name too - both attach to the same ServiceAccount.
      name: proxy-traefik
    persistence:
      enabled: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      # traefik binds :80 directly (see ports.web-internal below) - this pod
      # is reached over the tailnet via its own tailscale sidecar, not
      # through the k8s Service, so there's no Service port-translation to
      # fall back on.
      #
      # runAsUser: 0 overrides podSecurityContext's non-root default for
      # just this container. Confirmed via disposable test pods against this
      # cluster: NET_BIND_SERVICE does not actually let a non-root UID bind a
      # privileged port here (a bare Python socket.bind(('0.0.0.0', 80)) with
      # this exact capability set fails identically to Traefik's error,
      # while the same capability set as root succeeds) - a known class of
      # runc/containerd bug where added capabilities don't survive the
      # container's UID switch away from root. drop: ["ALL"] means this
      # "root" container still genuinely only holds NET_BIND_SERVICE, not
      # full root privileges - the tailscale sidecar is unaffected and stays
      # non-root, since it doesn't bind privileged ports.
      runAsNonRoot: false
      runAsUser: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        add: ["NET_BIND_SERVICE"]
    deployment:
      # Single replica: this pod carries its own tailnet identity (the
      # sidecar below, state persisted in a Kubernetes Secret via
      # TS_KUBE_SECRET), so it can't be scaled horizontally the way the
      # public Traefik instance can - two pods sharing one identity's state
      # would fight each other.
      replicas: 1
      additionalVolumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
      additionalContainers:
        - name: tailscale
          image: tailscale/tailscale:v1.76.6
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-proxy-infra-preauthkey
                  key: authkey
            - name: TS_HOSTNAME
              value: proxy-traefik
            # No TS_STATE_DIR/PVC: containerboot falls back to an
            # in-container /tmp cache and treats the Secret below as the
            # durable copy, syncing to it - so identity (and therefore this
            # pod's MagicDNS name) survives restarts without any volume.
            - name: TS_KUBE_SECRET
              value: proxy-traefik-tailscale-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.patinanetwork.org"
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-internal
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesCRD:
        enabled: true
    ports:
      # disable the chart's default public-style entrypoints on this
      # instance - we don't want anything here answering to "web"/"websecure".
      # Plain HTTP only: traffic never leaves the tailnet, which is already
      # WireGuard-encrypted, so we skip provisioning TLS certs for this one.
      #
      # port: 80 directly (not the chart's usual 8000->80 translation) -
      # tailnet traffic arrives straight at this pod's tailscale interface,
      # bypassing the k8s Service entirely, so there's no Service port
      # mapping to rely on here.
      web:
        expose:
          default: false
      websecure:
        expose:
          default: false
      web-internal:
        port: 80
        expose:
          default: true
        exposedPort: 80
        protocol: TCP
    service:
      # ClusterIP only - not publicly accessible. Also reachable from the
      # tailnet directly, via this pod's own tailscale sidecar (see above) -
      # the k8s Service itself is only relevant for in-cluster traffic.
      type: ClusterIP
