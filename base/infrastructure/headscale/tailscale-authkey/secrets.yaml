# -----------------------------------------------------------------------------
# MANUAL STEP REQUIRED - this file is intentionally UNENCRYPTED right now.
#
# It was authored without cluster/headscale/sops access, so the real preauth
# key couldn't be generated or encrypted here. Before this can be merged
# and applied:
#
#   1. Create a headscale user to own these service nodes (once):
#        kubectl exec -n infrastructure deploy/headscale -- \
#          headscale users create infra-services
#
#   2. Generate a reusable, long-lived preauth key for that user - it's
#      shared by both the coredns-proxy and traefik-internal sidecars:
#        kubectl exec -n infrastructure deploy/headscale -- \
#          headscale preauthkeys create --user infra-services --reusable --expiration 8760h
#
#   3. Put the printed key into `authkey` below, then encrypt this file:
#        just encrypt base/infrastructure/headscale/tailscale-authkey/secrets.yaml
#
# `just encrypt` / the pre-commit hook will refuse this file until step 3 is
# done - do not merge it with the placeholder value still in place.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-authkey
  namespace: infrastructure
type: Opaque
stringData:
  authkey: "REPLACE_ME_WITH_A_REAL_HEADSCALE_PREAUTH_KEY"
