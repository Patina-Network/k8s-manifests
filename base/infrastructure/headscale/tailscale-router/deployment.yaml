apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-router
  namespace: infrastructure
spec:
  # A single tailnet node whose only job is to advertise a subnet route for
  # the cluster's Service CIDR, so that `coredns-proxy` and `traefik-internal`
  # (both ClusterIP-only, i.e. not publicly reachable) become reachable from
  # the tailnet without needing to join the tailnet individually themselves.
  #
  # State is kept on a PVC so this node keeps the same tailnet identity
  # (and therefore doesn't need re-approving) across restarts/redeploys.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-router
  template:
    metadata:
      labels:
        app: tailscale-router
    spec:
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tailscale-router-state
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
      containers:
        - name: tailscale
          image: tailscale/tailscale # replaced from kustomization.yaml
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-router-authkey
                  key: authkey
            - name: TS_HOSTNAME
              value: k8s-proxy-router
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_ROUTES
              # TODO: confirm this against the real cluster Service CIDR before
              # relying on it - it is a guess based on common AKS defaults:
              #   az aks show --resource-group k8s --name k8s-manifests \
              #     --query networkProfile.serviceCidr -o tsv
              value: "10.0.0.0/16"
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.patinanetwork.org"
          volumeMounts:
            - { name: state, mountPath: /var/lib/tailscale }
            - { name: dev-net-tun, mountPath: /dev/net/tun }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
