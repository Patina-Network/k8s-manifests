apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-coredns
  namespace: infrastructure
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # can never be more than single replica
  # tailnet identity is tied to it
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vpn-coredns
  template:
    metadata:
      labels:
        app: vpn-coredns
    spec:
      serviceAccountName: vpn-coredns
      volumes:
        - name: config
          configMap:
            name: vpn-coredns-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
      containers:
        - name: coredns
          image: coredns/coredns # replaced from kustomization.yaml
          args:
            - -conf
            - /etc/coredns/Corefile
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - { containerPort: 53, name: dns, protocol: UDP }
            - { containerPort: 53, name: dns-tcp, protocol: TCP }
            - { containerPort: 8080, name: health, protocol: TCP }
            - { containerPort: 8181, name: ready, protocol: TCP }
          volumeMounts:
            - { name: config, mountPath: /etc/coredns, readOnly: true }
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
        - name: tailscale
          image: tailscale/tailscale # replaced from kustomization.yaml
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-vpn-infra-preauthkey
                  key: authkey
            - name: TS_HOSTNAME
              value: vpn-coredns
            - name: TS_KUBE_SECRET
              value: vpn-coredns-tailscale-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.patinanetwork.org"
          volumeMounts:
            - { name: dev-net-tun, mountPath: /dev/net/tun }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
