apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-traefik
  namespace: infrastructure
spec:
  interval: 30m
  install:
    createNamespace: true
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "" # replaced from kustomization.yaml
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  values:
    serviceAccount:
      name: vpn-traefik
    persistence:
      enabled: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        add: ["NET_BIND_SERVICE"]
    deployment:
      # can never be more than single replica
      # tailnet identity is tied to it
      replicas: 1
      annotations:
        reloader.stakater.com/auto: "true"
      additionalVolumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
      additionalContainers:
        - name: tailscale
          image: tailscale/tailscale # replaced from kustomization.yaml
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-vpn-infra-preauthkey
                  key: authkey
            - name: TS_HOSTNAME
              value: vpn-traefik
            - name: TS_KUBE_SECRET
              value: vpn-traefik-tailscale-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.patinanetwork.org"
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-internal
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesCRD:
        enabled: true
    ports:
      web:
        expose:
          default: false
      websecure:
        expose:
          default: false
      web-vpn:
        port: 80
        expose:
          default: true
        exposedPort: 80
        protocol: TCP
      websecure-vpn:
        port: 443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        http:
          tls:
            enabled: true
      postgres:
        port: 5432
        expose:
          default: true
        exposedPort: 5432
        protocol: TCP
      redis:
        port: 6379
        expose:
          default: true
        exposedPort: 6379
        protocol: TCP
    service:
      type: ClusterIP
