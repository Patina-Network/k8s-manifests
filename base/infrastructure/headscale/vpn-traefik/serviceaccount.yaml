apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpn-traefik
  namespace: infrastructure
---
# used to update secret state created in state.yaml & persist tailnet identity
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vpn-traefik-tailscale-state
  namespace: infrastructure
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vpn-traefik-tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vpn-traefik-tailscale-state
  namespace: infrastructure
subjects:
  - kind: ServiceAccount
    name: vpn-traefik
    namespace: infrastructure
roleRef:
  kind: Role
  name: vpn-traefik-tailscale-state
  apiGroup: rbac.authorization.k8s.io
