apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebloom-leetcode-auth-stealer-service
spec:
  template:
    spec:
      nodeSelector:
        agentpool: prodpoolv1
      tolerations:
        - key: workload
          operator: Equal
          value: production
          effect: NoSchedule
      containers:
        - name: codebloom-leetcode-auth-stealer-service
          env:
            - name: ENVIRONMENT
              value: production
