apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebloom
spec:
  template:
    spec:
      nodeSelector:
        agentpool: prodpoolv1
      tolerations:
        - key: workload
          operator: Equal
          value: production
          effect: NoSchedule
      containers:
        - name: codebloom
          env:
            - name: LEETCODE_AUTH_STEALER_SERVICE_TARGET
              value: codebloom-leetcode-auth-stealer-service:50051
          envFrom:
            - secretRef:
                name: codebloom-production-secrets
