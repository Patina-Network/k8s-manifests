apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base/codebloom
  - certificate.yaml
  - ingress.yaml
  - secrets.yaml
patches:
  - path: deployment-patch.yaml
configMapGenerator:
  - name: codebloom-spring-config
    behavior: merge
    files:
      - application-prod.yaml
commonLabels:
  app: codebloom
  environment: production
images:
  - name: patinanetwork/codebloom-arm
    newTag: 67b44e4

replacements:
  - source:
      kind: Deployment
      name: codebloom
      fieldPath: spec.template.spec.containers.[name=codebloom].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: codebloom
        fieldPaths:
          - spec.template.spec.containers.[name=codebloom].env.[name=VERSION].value
          - spec.template.metadata.labels.version
