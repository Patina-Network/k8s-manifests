apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base/hello-world-client-java
  - certificate-vpn.yaml
  - ingress-vpn.yaml
patches:
  - path: deployment-patch.yaml
commonLabels:
  app: hello-world-client-java
  environment: production
images:
  - name: patinanetwork/hello-world-client-java-arm
    newTag: 1.0.0

replacements:
  - source:
      kind: Deployment
      name: hello-world-client-java
      fieldPath: spec.template.spec.containers.[name=hello-world-client-java].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: hello-world-client-java
        fieldPaths:
          - spec.template.spec.containers.[name=hello-world-client-java].env.[name=VERSION].value
          - spec.template.metadata.labels.version
