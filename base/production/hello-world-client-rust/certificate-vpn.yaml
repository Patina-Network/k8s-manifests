apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: production-hello-world-client-rust-vpn-tls
  namespace: production
spec:
  secretName: production-hello-world-client-rust-vpn-tls
  dnsNames:
    - hello-world-grpc-client-rust.vpn.patinanetwork.org
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
