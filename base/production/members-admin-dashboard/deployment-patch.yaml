apiVersion: apps/v1
kind: Deployment
metadata:
  name: members-admin-dashboard
spec:
  template:
    spec:
      nodeSelector:
        agentpool: prodpoolv1
      tolerations:
        - key: workload
          operator: Equal
          value: production
          effect: NoSchedule
      containers:
        - name: members-admin-dashboard
          env:
            - name: ENVIRONMENT
              value: production
            - name: AZURE_ADMIN_EMAILS
              value: tahmid@patinanetwork.onmicrosoft.com,gene.kim@patinanetwork.onmicrosoft.com
            - name: APP_ORIGIN
              value: https://members-admin-dashboard.vpn.patinanetwork.org
          envFrom:
            - secretRef:
                name: members-admin-dashboard-production-secrets
