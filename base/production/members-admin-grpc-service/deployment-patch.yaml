apiVersion: apps/v1
kind: Deployment
metadata:
  name: members-admin-grpc-service
spec:
  template:
    spec:
      nodeSelector:
        agentpool: prodpoolv1
      tolerations:
        - key: workload
          operator: Equal
          value: production
          effect: NoSchedule
      containers:
        - name: members-admin-grpc-service
          envFrom:
            - secretRef:
                name: members-grpc-service-secrets
            - secretRef:
                name: members-grpc-service-administrator-secrets
