apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: members-grpc-service-vpn-web
  namespace: production
spec:
  entryPoints:
    - web-vpn
  routes:
    - match: Host(`members-grpc-service.vpn.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: members-grpc-service
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: members-grpc-service-vpn-websecure
  namespace: production
spec:
  entryPoints:
    - websecure-vpn
  routes:
    - match: Host(`members-grpc-service.vpn.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: members-grpc-service
          port: 80
  tls:
    secretName: production-members-grpc-service-vpn-tls
---
