apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: no-calls-from-staging
spec:
  description: Deny all ingress from pods in the staging namespace to production pods.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: staging
