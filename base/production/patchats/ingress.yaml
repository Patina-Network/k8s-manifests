apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: patchats-web
  namespace: production
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`patchats.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: patchats
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: patchats-websecure
  namespace: production
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`patchats.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: patchats
          port: 80
  tls:
    secretName: production-patchats-tls
