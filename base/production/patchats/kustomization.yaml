apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate.yaml
  - deployment.yaml
  - ingress.yaml
  - secrets.yaml
  - service.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: patchats-spring-config
    files:
      - application-prod.yaml
commonLabels:
  app: patchats
  environment: production
images:
  - name: patinanetwork/patchats
    newTag: v3_test # update me to change version

replacements:
  - source:
      kind: Deployment
      name: patchats
      fieldPath: spec.template.spec.containers.[name=patchats].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: patchats
        fieldPaths:
          - spec.template.spec.containers.[name=patchats].env.[name=VERSION].value
          - spec.template.metadata.labels.version
