apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base/redis
  - certificate-vpn.yaml
  - ingress-vpn.yaml
  - secrets.yaml
patches:
  - path: deployment-patch.yaml
commonLabels:
  app: redis
  environment: production
images:
  - name: redis
    newTag: 8.6.2-alpine

replacements:
  - source:
      kind: Deployment
      name: redis
      fieldPath: spec.template.spec.containers.[name=redis].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: redis
        fieldPaths:
          - spec.template.metadata.labels.version
