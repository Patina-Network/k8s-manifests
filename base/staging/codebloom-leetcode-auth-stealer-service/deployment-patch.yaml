apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebloom-leetcode-auth-stealer-service
spec:
  template:
    spec:
      nodeSelector:
        agentpool: stgpoolv1
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      containers:
        - name: codebloom-leetcode-auth-stealer-service
          env:
            - name: GRPC_REFLECTION
              value: "true"
            - name: ENVIRONMENT
              value: staging
