apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebloom-leetcode-auth-stealer-service
spec:
  template:
    spec:
      nodeSelector:
        agentpool: stgpoolv1
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      containers:
        - name: codebloom-leetcode-auth-stealer-service
          env:
            - name: GRPC_REFLECTION
              value: "true"
            # uncomment if you want to be able to port-forward 5900
            # and attach a display to browser
            # - name: DISABLE_VIRTUAL
            #   value: "true"
            - name: ENVIRONMENT
              value: staging
