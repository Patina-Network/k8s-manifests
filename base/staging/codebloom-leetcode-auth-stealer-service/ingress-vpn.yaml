apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: codebloom-leetcode-auth-stealer-service-vpn-web
  namespace: staging
spec:
  entryPoints:
    - web-vpn
  routes:
    - match: Host(`stg.codebloom-leetcode-auth-stealer-service.vpn.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: codebloom-leetcode-auth-stealer-service
          port: 8081
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: codebloom-leetcode-auth-stealer-service-vpn-websecure
  namespace: staging
spec:
  entryPoints:
    - websecure-vpn
  routes:
    - match: Host(`stg.codebloom-leetcode-auth-stealer-service.vpn.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: codebloom-leetcode-auth-stealer-service
          port: 8081
  tls:
    secretName: staging-codebloom-leetcode-auth-stealer-service-vpn-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: codebloom-leetcode-auth-stealer-service-vpn-grpc
  namespace: staging
spec:
  entryPoints:
    - vpn-grpc
  routes:
    - match: HostSNI(`stg.codebloom-leetcode-auth-stealer-service.vpn.patinanetwork.org`)
      services:
        - name: codebloom-leetcode-auth-stealer-service
          port: 50051
  tls:
    secretName: staging-codebloom-leetcode-auth-stealer-service-vpn-tls
