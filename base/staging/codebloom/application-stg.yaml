# shared defaults live in base/base/codebloom/application.yaml

server:
  url: https://stg.vpn.codebloom.patinanetwork.org

management:
  endpoint:
    env:
      # /actuator/* is pwd protected so this is ok
      show-values: "always"

leetcode:
  auth:
    strategy: direct # can be "direct" or "github"

grpc:
  leetcode-auth-stealer-service:
    host: codebloom-leetcode-auth-stealer-service:50051
    tls: false
    timeout: 2m

ff:
  # duels: true
  user-metrics: true
