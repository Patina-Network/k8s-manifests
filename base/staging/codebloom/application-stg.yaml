# shared defaults live in base/base/codebloom/application.yaml

server:
  url: https://stg.vpn.codebloom.patinanetwork.org

management:
  endpoint:
    env:
      # /actuator/* is pwd protected so this is ok
      show-values: "always"

grpc:
  leetcode-auth-service:
    host: codebloom-leetcode-auth-service:50052
    tls: false
    timeout: 2m

ff:
  # duels: true
  user-metrics: true
  ui:
    duels: false
    userMetrics: true
