apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebloom
spec:
  template:
    spec:
      nodeSelector:
        agentpool: stgpoolv1
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      containers:
        - name: codebloom
          env:
            - name: LEETCODE_AUTH_STEALER_SERVICE_TARGET
              value: codebloom-leetcode-auth-stealer-service:50051
            - name: VITE_STAGING
              value: "true"
            # image by default sets SPRING_PROFILES_ACTIVE=prod; override so application-stg.yaml loads
            - name: SPRING_PROFILES_ACTIVE
              value: "stg"
          envFrom:
            - secretRef:
                name: codebloom-staging-secrets
