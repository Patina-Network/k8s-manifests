# Test route for the tailnet-only proxy setup (see
# base/infrastructure/headscale/{coredns,traefik-internal,tailscale-router}).
# Only reachable from the tailnet, via split DNS + traefik-internal - this is
# entirely separate from the public codebloom-web/-websecure routes below.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: codebloom-proxy-internal
  namespace: staging
spec:
  entryPoints:
    - web-internal
  routes:
    - match: Host(`stg.codebloom.proxy.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: codebloom
          port: 80
