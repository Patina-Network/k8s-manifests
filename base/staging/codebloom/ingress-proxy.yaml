apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: codebloom-proxy-web
  namespace: staging
spec:
  entryPoints:
    - web-proxy
  routes:
    - match: Host(`stg.codebloom.proxy.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: codebloom
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: codebloom-proxy-websecure
  namespace: staging
spec:
  entryPoints:
    - websecure-proxy
  routes:
    - match: Host(`stg.codebloom.proxy.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: codebloom
          port: 80
  # `*.proxy.patinanetwork.org` automatically gets tls cert from catch all
  # which is applied by default to proxy-traefik
  tls: {}
