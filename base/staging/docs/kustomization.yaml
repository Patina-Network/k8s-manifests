apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate-vpn.yaml
  - deployment.yaml
  - ingress-vpn.yaml
  - service.yaml
commonLabels:
  app: docs
  environment: staging
images:
  - name: patinanetwork/docs
    newTag: "1.0.1" # update me to change version

replacements:
  - source:
      kind: Deployment
      name: docs
      fieldPath: spec.template.spec.containers.[name=docs].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: docs
        fieldPaths:
          - spec.template.spec.containers.[name=docs].env.[name=VERSION].value
          - spec.template.metadata.labels.version
