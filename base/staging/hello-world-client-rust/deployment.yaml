apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-client-rust
  namespace: staging
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hello-world-client-rust
  template:
    metadata:
      labels:
        app: hello-world-client-rust
        version: "N/A" # replaced from kustomization.yaml
    spec:
      nodeSelector:
        agentpool: stgpoolv1
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      containers:
        - name: hello-world-client-rust
          image: patinanetwork/hello-world-client-rust
          ports:
            - name: http-web
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-web
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-web
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: VERSION
              value: "N/A" # replaced from kustomization.yaml
            - name: GRPC_TARGET
              value: hello-world-grpc-service:50051
            - name: GRPC_TLS
              value: "false"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "250m"
