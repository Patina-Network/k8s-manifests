apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate-vpn.yaml
  - deployment.yaml
  - ingress-vpn.yaml
  - service.yaml
commonLabels:
  app: hello-world-client-rust
  environment: staging
images:
  - name: patinanetwork/hello-world-client-rust
    newTag: trest # update me to change version

replacements:
  - source:
      kind: Deployment
      name: hello-world-client-rust
      fieldPath: spec.template.spec.containers.[name=hello-world-client-rust].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: hello-world-client-rust
        fieldPaths:
          - spec.template.spec.containers.[name=hello-world-client-rust].env.[name=VERSION].value
          - spec.template.metadata.labels.version
