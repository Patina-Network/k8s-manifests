apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base/hello-world-grpc-service
  - certificate-vpn.yaml
  - ingress-vpn.yaml
patches:
  - path: deployment-patch.yaml
commonLabels:
  app: hello-world-grpc-service
  environment: staging
images:
  - name: patinanetwork/hello-world-grpc-service-arm
    newTag: "staging-0ef29413" # update me to change version

replacements:
  - source:
      kind: Deployment
      name: hello-world-grpc-service
      fieldPath: spec.template.spec.containers.[name=hello-world-grpc-service].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: hello-world-grpc-service
        fieldPaths:
          - spec.template.spec.containers.[name=hello-world-grpc-service].env.[name=VERSION].value
          - spec.template.metadata.labels.version
