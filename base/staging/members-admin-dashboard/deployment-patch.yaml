apiVersion: apps/v1
kind: Deployment
metadata:
  name: members-admin-dashboard
spec:
  template:
    spec:
      nodeSelector:
        agentpool: stgpoolv1
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      containers:
        - name: members-admin-dashboard
          env:
            - name: ENVIRONMENT
              value: staging
