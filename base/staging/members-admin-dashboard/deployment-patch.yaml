apiVersion: apps/v1
kind: Deployment
metadata:
  name: members-admin-dashboard
spec:
  template:
    spec:
      nodeSelector:
        agentpool: stgpoolv1
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      containers:
        - name: members-admin-dashboard
          env:
            - name: ENVIRONMENT
              value: staging
            - name: AZURE_ADMIN_EMAILS
              value: angela.yu@patinanetwork.onmicrosoft.com,tahmid@patinanetwork.onmicrosoft.com
            - name: APP_ORIGIN
              value: https://stg.members-admin-dashboard.vpn.patinanetwork.org
          envFrom:
            - secretRef:
                name: members-admin-dashboard-staging-secrets
