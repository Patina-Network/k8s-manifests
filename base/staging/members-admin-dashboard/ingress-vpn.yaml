apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: members-admin-dashboard-vpn-web
  namespace: staging
spec:
  entryPoints:
    - web-vpn
  routes:
    - match: Host(`stg.members-admin-dashboard.vpn.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: members-admin-dashboard
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: members-admin-dashboard-vpn-websecure
  namespace: staging
spec:
  entryPoints:
    - websecure-vpn
  routes:
    - match: Host(`stg.members-admin-dashboard.vpn.patinanetwork.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: members-admin-dashboard
          port: 80
  tls:
    secretName: staging-members-admin-dashboard-vpn-tls
