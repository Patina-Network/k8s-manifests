apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base/members-grpc-service
  - certificate-vpn.yaml
  - ingress-vpn.yaml
  - secrets.yaml
patches:
  - path: deployment-patch.yaml
commonLabels:
  app: members-grpc-service
  environment: staging
images:
  - name: patinanetwork/members-grpc-service-arm
    newTag: staging-e22c7a64

replacements:
  - source:
      kind: Deployment
      name: members-grpc-service
      fieldPath: spec.template.spec.containers.[name=members-grpc-service].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: members-grpc-service
        fieldPaths:
          - spec.template.spec.containers.[name=members-grpc-service].env.[name=VERSION].value
          - spec.template.metadata.labels.version
