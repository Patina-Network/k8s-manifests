apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: no-calls-from-production
spec:
  description: Deny all ingress from pods in the production namespace to staging pods.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: production
