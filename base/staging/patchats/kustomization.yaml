apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base/patchats
  - certificate-vpn.yaml
  - ingress-vpn.yaml
  - secrets.yaml
patches:
  - path: deployment-patch.yaml
configMapGenerator:
  - name: patchats-spring-config
    behavior: merge
    files:
      - application-stg.yaml
commonLabels:
  app: patchats
  environment: staging
images:
  - name: patinanetwork/patchats-arm
    newTag: staging-bea6b16

replacements:
  - source:
      kind: Deployment
      name: patchats
      fieldPath: spec.template.spec.containers.[name=patchats].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: patchats
        fieldPaths:
          - spec.template.spec.containers.[name=patchats].env.[name=VERSION].value
          - spec.template.metadata.labels.version
