apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: artifact-keeper-ingress-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./base/infrastructure/artifact-keeper/ingress
  dependsOn:
    - name: artifact-keeper-infrastructure
    - name: cert-manager-issuer-infrastructure
    - name: headscale-vpn-traefik-infrastructure
    - name: middleware-infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: infrastructure
