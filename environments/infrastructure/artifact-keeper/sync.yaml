apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: artifact-keeper-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./base/infrastructure/artifact-keeper
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: infrastructure
  decryption:
    provider: sops
