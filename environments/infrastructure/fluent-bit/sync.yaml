apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fluent-bit-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./base/infrastructure/fluent-bit
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: infrastructure
  wait: true
  timeout: 5m
