apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headscale-tailscale-router-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./base/infrastructure/headscale/tailscale-router
  dependsOn:
    - name: headscale-infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: infrastructure
  decryption:
    provider: sops
