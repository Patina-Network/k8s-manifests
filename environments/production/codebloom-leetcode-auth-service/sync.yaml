apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: codebloom-leetcode-auth-service-production
  namespace: flux-system
spec:
  interval: 5m
  path: ./base/production/codebloom-leetcode-auth-service
  dependsOn:
    - name: redis-production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: production
  decryption:
    provider: sops
