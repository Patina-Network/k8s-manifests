apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hello-world-client-java-production
  namespace: flux-system
spec:
  interval: 5m
  path: ./base/production/hello-world-client-java
  dependsOn:
    - name: cert-manager-issuer-infrastructure
    - name: traefik-infrastructure
    - name: middleware-production
    - name: headscale-vpn-traefik-infrastructure
    - name: hello-world-grpc-service-production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: production
