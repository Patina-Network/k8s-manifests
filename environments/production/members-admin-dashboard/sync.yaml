apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: members-admin-dashboard-production
  namespace: flux-system
spec:
  interval: 5m
  path: ./base/production/members-admin-dashboard
  dependsOn:
    - name: cert-manager-issuer-infrastructure
    - name: traefik-infrastructure
    - name: middleware-production
    - name: headscale-vpn-traefik-infrastructure
    - name: members-admin-grpc-service-production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: production
  decryption:
    provider: sops
