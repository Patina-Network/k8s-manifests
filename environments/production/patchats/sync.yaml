apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: patchats
  namespace: flux-system
spec:
  interval: 5m
  path: ./base/production/patchats
  dependsOn:
    - name: cert-manager-issuer-infrastructure
    - name: traefik-infrastructure
    - name: middleware-production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: production
