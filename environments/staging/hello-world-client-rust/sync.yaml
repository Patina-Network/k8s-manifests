apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hello-world-client-rust-staging
  namespace: flux-system
spec:
  interval: 5m
  path: ./base/staging/hello-world-client-rust
  dependsOn:
    - name: cert-manager-issuer-infrastructure
    - name: traefik-infrastructure
    - name: middleware-staging
    - name: headscale-vpn-traefik-infrastructure
    - name: hello-world-grpc-service-staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: staging
