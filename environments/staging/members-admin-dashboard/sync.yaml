apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: members-admin-dashboard-staging
  namespace: flux-system
spec:
  interval: 5m
  path: ./base/staging/members-admin-dashboard
  dependsOn:
    - name: cert-manager-issuer-infrastructure
    - name: traefik-infrastructure
    - name: middleware-staging
    - name: headscale-vpn-traefik-infrastructure
    - name: members-admin-grpc-service-staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: staging
